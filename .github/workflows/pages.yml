name: Deploy static PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          path: portable-dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded artifact to become available
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, GITHUB_TOKEN, PAGES_ARTIFACT_ID, PAGES_ARTIFACT_NAME } = process.env;
          const url = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${encodeURIComponent(PAGES_ARTIFACT_NAME)}`;
          for (let attempt = 0; attempt < 24; attempt++) {
            const response = await fetch(url, { headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(15000), redirect: 'error' });
            if (!response.ok) throw Error(`Artifact lookup failed: HTTP ${response.status}`);
            const { artifacts } = await response.json();
            const matching = artifacts.filter(item => item.name === PAGES_ARTIFACT_NAME && !item.expired);
            if (matching.length === 1 && String(matching[0].id) === PAGES_ARTIFACT_ID) {
              console.log('Uploaded Pages artifact is ready.');
              process.exit(0);
            }
            if (matching.length > 1) throw Error('Duplicate Pages artifacts for this deployment attempt.');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw Error('Uploaded Pages artifact did not become available in time.');
          NODE
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
