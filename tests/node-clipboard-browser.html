<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사유 노드 단축키 브라우저 검사</title>
  <style>
    body { max-width: 900px; margin: 32px auto; padding: 20px; color: #273044; font: 16px/1.6 system-ui, sans-serif; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 10px 16px; background: #6654d9; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #fixture { margin-top: 24px; padding: 16px; border: 1px solid #dce0ec; border-radius: 10px; }
    #fixture input { margin-left: 12px; padding: 8px; }
    #result { white-space: pre-wrap; padding: 14px; background: #f4f3fa; border-radius: 8px; }
    [data-pass="true"] { color: #15803d; }
    [data-pass="false"] { color: #b42318; }
  </style>
  <script type="module">
    import RefreshRuntime from "/@react-refresh";
    RefreshRuntime.injectIntoGlobalHook(window);
    window.$RefreshReg$ = () => {};
    window.$RefreshSig$ = () => type => type;
    window.__vite_plugin_react_preamble_installed__ = true;
  </script>
</head>
<body>
  <h1>노드 단축키 브라우저 검사</h1>
  <p>실제 복사·붙여넣기 처리기를 메모리 속 시험 맵으로 검사합니다. 기기 클립보드, 저장 자료, Firebase에는 접근하지 않습니다. 합성 키·클립보드 이벤트 검사이며 실제 iPad 키보드 검증을 대신하지 않습니다.</p>
  <button id="run" type="button">RUN · 단축키 회귀 검사</button>
  <pre id="result" role="status">실행 대기</pre>
  <ol id="cases"></ol>
  <div id="fixture"></div>
  <script type="module" src="./node-clipboard-browser.tsx"></script>
</body>
</html>
